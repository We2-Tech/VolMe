server {
    listen 8080;
    server_name _;

    # Re-resolve the `app` service through Docker's embedded DNS instead of
    # caching its IP once at startup. A rebuilt app container gets a new IP on
    # the compose network; with a static `upstream` block nginx keeps hitting
    # the old IP and every request 502s until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app http://app:3000;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Next.js static assets are content-hashed at build time → safe to cache forever
    location /_next/static/ {
        proxy_pass $upstream_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # public/ assets — moderate cache
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        proxy_pass $upstream_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # all other requests (pages, API routes, locale redirects) → Next.js
    location / {
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
